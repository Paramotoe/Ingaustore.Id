name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix react-frontend

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build and Deploy to Vercel
        run: |
          npm run build --prefix react-frontend
          cp -R react-frontend/dist/. .
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          cat deployment-url.txt

      - name: Verifikasi deployment
        run: |
          DEPLOY_URL=$(tail -n 1 deployment-url.txt | tr -d '[:space:]')
          echo "Memeriksa URL produksi: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Error: URL deployment tidak ditemukan."
            exit 1
          fi
          
          # Vercel Deployment Protection (SSO) menutup URL deployment, jadi
          # status diverifikasi lewat API Vercel, bukan curl ke URL deployment.
          vercel inspect "$DEPLOY_URL" --wait --timeout=180s --token=${{ secrets.VERCEL_TOKEN }} --json > inspect.json
          READY=$(python3 -c "import json;print(json.load(open('inspect.json'))['readyState'])")
          TARGET=$(python3 -c "import json;print(json.load(open('inspect.json'))['target'])")
          PROD_URL="https://$(python3 -c "import json;print(json.load(open('inspect.json'))['aliases'][0])")"
          echo "readyState=$READY target=$TARGET produksi=$PROD_URL"
          if [ "$READY" != "READY" ]; then
            echo "Error: deployment belum READY (status: $READY)"
            exit 1
          fi
          if [ "$TARGET" != "production" ]; then
            echo "Error: target deployment bukan production (target: $TARGET)"
            exit 1
          fi
          if ! curl -fsS "$PROD_URL" | grep -q "Katalog Produk"; then
            echo "Error: penanda 'Katalog Produk' TIDAK ada di $PROD_URL"
            exit 1
          fi
          echo "Verifikasi sukses: $PROD_URL menayangkan katalog."
