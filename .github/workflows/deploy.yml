name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix react-frontend

      - name: Deploy Project Artifacts to Vercel
        run: |
          # Workflow butuh 3 GitHub Secret: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
          # Nilai orgId dan projectId diambil dari .vercel/project.json
          # (orgId: team_ZSsvtzurANpWoUpSA0xuWAeI, projectId: prj_eIyNIchNAdXL7Wg70L309dSlKBmE).
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} > deployment-url.txt
          cat deployment-url.txt

      - name: Verifikasi deployment
        run: |
          DEPLOY_URL=$(tail -n 1 deployment-url.txt | tr -d '[:space:]')
          echo "Memeriksa URL produksi: $DEPLOY_URL"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Error: URL deployment tidak ditemukan."
            exit 1
          fi
          
          # Retry loop untuk memastikan server merespons (maksimal 5 kali percobaan, jeda 5 detik)
          HTTP_STATUS=000
          for i in $(seq 1 5); do
            HTTP_STATUS=$(curl -s -o response.html -w "%{http_code}" "$DEPLOY_URL" || echo "000")
            echo "Percobaan $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              break
            fi
            sleep 5
          done
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: deployment gagal, HTTP $HTTP_STATUS dari $DEPLOY_URL"
            exit 1
          fi
          
          if grep -q "Katalog Produk" response.html; then
            echo "Verifikasi sukses: penanda 'Katalog Produk' ada di HTML $DEPLOY_URL"
          else
            echo "Error: penanda 'Katalog Produk' TIDAK ada di HTML $DEPLOY_URL"
            exit 1
          fi
