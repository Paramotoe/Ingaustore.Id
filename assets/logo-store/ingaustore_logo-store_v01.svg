<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="640" rx="32" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="24" y="24" width="552" height="490" rx="24" fill="#fff7ed" stroke="#f9a8d4" stroke-width="3" opacity="0.6"/>

  <!-- Shopping Cart & Contents -->
  <g transform="translate(40, 20)">
    <!-- Handle -->
    <path d="M110 260 V230 Q110 210 130 210 H390 Q410 210 410 230 V260" fill="none" stroke="#db2777" stroke-width="18" stroke-linecap="round"/>

    <!-- Products inside Cart: Action Figure / Toy (Left), Baby Bottle / Home item (Right) -->
    <!-- Toy / Action Figure -->
    <g transform="translate(100, 215)">
      <rect x="0" y="10" width="36" height="45" rx="8" fill="#3b82f6"/>
      <circle cx="18" cy="2" r="12" fill="#3b82f6"/>
    </g>
    <!-- Baby Bottle / Home Item -->
    <g transform="translate(380, 210)">
      <rect x="0" y="10" width="32" height="50" rx="10" fill="#fb923c"/>
      <rect x="8" y="0" width="16" height="12" rx="4" fill="#fb923c"/>
    </g>

    <!-- Family in Cart: 2 Boy Kids + Mother Center -->
    <!-- Boy Kid Left (Short hair / boyish cap style) -->
    <g transform="translate(170, 195)">
      <circle cx="22" cy="22" r="22" fill="#3b82f6"/>
      <path d="M5 12 Q22 -2 39 12 Z" fill="#0f172a"/> <!-- boy hair -->
      <path d="M-4 75 a26 34 0 0 1 52 0 Z" fill="#3b82f6"/>
    </g>

    <!-- Boy Kid Right -->
    <g transform="translate(310, 195)">
      <circle cx="22" cy="22" r="22" fill="#fb923c"/>
      <path d="M5 12 Q22 -2 39 12 Z" fill="#0f172a"/> <!-- boy hair -->
      <path d="M-4 75 a26 34 0 0 1 52 0 Z" fill="#fb923c"/>
    </g>

    <!-- Mother Center (Higher, distinct hair bun / styling) -->
    <g transform="translate(232, 160)">
      <circle cx="24" cy="24" r="28" fill="#db2777"/>
      <circle cx="24" cy="-4" r="10" fill="#db2777"/> <!-- bun -->
      <path d="M-8 80 a32 40 0 0 1 64 0 Z" fill="#db2777"/>
    </g>

    <!-- Shopping Cart Basket -->
    <path d="M70 270 H450 L410 440 Q404 460 384 460 H136 Q116 460 110 440 Z" fill="url(#brandGrad)" stroke="#db2777" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Cart Grid Lines -->
    <path d="M96 330 H424 M108 380 H412" stroke="#fff7ed" stroke-width="8" stroke-linecap="round" opacity="0.6"/>

    <!-- Wheels -->
    <circle cx="160" cy="485" r="22" fill="#0f172a"/>
    <circle cx="160" cy="485" r="8" fill="#fff7ed"/>
    <circle cx="360" cy="485" r="22" fill="#0f172a"/>
    <circle cx="360" cy="485" r="8" fill="#fff7ed"/>
  </g>

  <!-- Brand Name Typography Banner -->
  <text x="300" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">INGAUSTORE<tspan fill="#ec4899">.ID</tspan></text>
  <text x="300" y="612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle" letter-spacing="4">MAINAN • PERABOT • FASHION • ACTION FIGURE</text>
</svg>
